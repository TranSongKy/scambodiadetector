name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  database:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Only-Password-123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci-Only-Password-123 -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool restore
      - run: dotnet restore src/ScamDetector.Infrastructure
      - name: Apply migrations to SQL Server
        run: >-
          dotnet ef database update
          --project src/ScamDetector.Infrastructure
          --connection "Server=localhost,1433;Database=ScamDetector;User Id=sa;Password=Ci-Only-Password-123;TrustServerCertificate=True"

  tokenizer-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: pip install "transformers>=4.45"
      - name: Generate golden ids with the real PhoBERT tokenizer
        working-directory: scripts
        run: python make_tokenizer_golden.py "$RUNNER_TEMP/phobert"
      - name: Compare with the .NET tokenizer
        run: dotnet run scripts/VerifyTokenizer.cs -- "$RUNNER_TEMP/phobert"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.20
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s scripts/tests -t .
      - name: Validate threat intel
        run: python scripts/validate_threat_intel.py
      - name: Validate training candidates
        run: python scripts/validate_training_candidates.py
      - name: Validate dataset
        run: |
          if [ "$(wc -l < data/processed/dataset.csv)" -gt 1 ]; then
            python scripts/validate_dataset.py --collecting data/processed/dataset.csv
          else
            echo "dataset.csv chưa có mẫu, bỏ qua bước validate."
          fi

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: End-to-end test (side panel, OCR, API calls)
        run: npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: scambodia-extension.zip

  docker:
    runs-on: ${{ matrix.runner }}
    needs: dotnet
    strategy:
      matrix:
        project: [ScamDetector.Api, ScamDetector.Bot]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: PROJECT=${{ matrix.project }}
          tags: scam-detector:ci
      - name: Smoke test container without model
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          docker run -d --name app -p 8080:8080 -e Telegram__BotToken=ci-placeholder scam-detector:ci
          status=""
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            [ "$status" = "503" ] && break
            sleep 1
          done
          docker logs app
          test "$status" = "503"
          if [ "$PROJECT" = "ScamDetector.Api" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
              -d '{"text":"xin chao"}' http://localhost:8080/api/v1/classifications)
            test "$code" = "503"
          fi
          docker exec app test -s /threat-intel/blocked_domains.csv
          docker exec app test -s /threat-intel/scam_templates.csv

  deploy:
    runs-on: ubuntu-24.04-arm
    needs: dotnet
    defaults:
      run:
        working-directory: deploy/oracle
    steps:
      - uses: actions/checkout@v4
      - name: Lint deploy script
        run: shellcheck scambodia.sh
      - name: Validate compose file
        run: |
          DOMAIN=localhost docker compose config --quiet
          DOMAIN=localhost COMPOSE_PROFILES=bot docker compose config --services | grep -qx bot
      - name: Run API behind Caddy on ARM64
        env:
          DOMAIN: localhost
        run: |
          docker compose up -d --build api caddy
          status=""
          for attempt in $(seq 1 60); do
            status=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/health || true)
            [ "$status" = "503" ] && break
            sleep 2
          done
          docker compose logs api caddy
          test "$status" = "503"
          code=$(curl -sk -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
            -d '{"text":"xin chao"}' https://localhost/api/v1/classifications)
          test "$code" = "503"
          curl -skI https://localhost/health | grep -qi '^strict-transport-security'
      - name: Stop
        if: always()
        env:
          DOMAIN: localhost
        run: docker compose down -v

