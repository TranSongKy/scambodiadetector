name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.20
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s scripts/tests -t .
      - name: Validate dataset
        run: |
          if [ "$(wc -l < data/processed/dataset.csv)" -gt 1 ]; then
            python scripts/validate_dataset.py data/processed/dataset.csv
          else
            echo "dataset.csv chưa có mẫu, bỏ qua bước validate."
          fi

  docker:
    runs-on: ubuntu-latest
    needs: dotnet
    strategy:
      matrix:
        project: [ScamDetector.Api, ScamDetector.Bot]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: PROJECT=${{ matrix.project }}
          tags: scam-detector:ci
      - name: Smoke test container without model
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          docker run -d --name app -p 8080:8080 -e Telegram__BotToken=ci-placeholder scam-detector:ci
          status=""
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            [ "$status" = "503" ] && break
            sleep 1
          done
          docker logs app
          test "$status" = "503"
          if [ "$PROJECT" = "ScamDetector.Api" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
              -d '{"text":"xin chao"}' http://localhost:8080/api/v1/classifications)
            test "$code" = "503"
          fi
