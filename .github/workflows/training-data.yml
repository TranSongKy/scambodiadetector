name: Training data

on:
  schedule:
    - cron: "41 0 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "collect: thu thập và mở PR; dry-run: chỉ báo cáo"
        type: choice
        options: [collect, dry-run]
        default: collect
      max_new:
        description: "Số ứng viên mới tối đa"
        required: false
        default: "300"
  pull_request:
    paths:
      - "scripts/training_data/**"
      - "scripts/collect_training_candidates.py"
      - "data/training-candidates/sources.json"
      - ".github/workflows/training-data.yml"

permissions:
  contents: read

concurrency:
  group: training-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect candidates without writing data
        run: python scripts/collect_training_candidates.py --dry-run --report "$RUNNER_TEMP/training-data-report.md"
      - name: Publish report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/training-data-report.md" ]; then
            cat "$RUNNER_TEMP/training-data-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  collect:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'collect')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect candidates
        env:
          MAX_NEW: ${{ inputs.max_new || '300' }}
        run: python scripts/collect_training_candidates.py --max-new "$MAX_NEW" --report "$RUNNER_TEMP/training-data-report.md"
      - name: Enforce candidate rules
        run: python scripts/validate_training_candidates.py
      - name: Python unit tests
        run: python -m unittest discover -s scripts/tests -t .
      - name: Date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Open review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.THREAT_INTEL_TOKEN || github.token }}
          branch: training-data/candidates
          delete-branch: true
          add-paths: |
            data/training-candidates/candidates.csv
          commit-message: "data(training): ứng viên mới ngày ${{ steps.date.outputs.today }}"
          title: "Dữ liệu huấn luyện: ứng viên mới ngày ${{ steps.date.outputs.today }}"
          body-path: ${{ runner.temp }}/training-data-report.md
          labels: training-data
