name: scambodia

x-detector-common: &detector-common
  restart: unless-stopped
  volumes:
    - ../../models:/models:ro
    - ../../data/threat-intel:/threat-intel:ro
  depends_on:
    - ollama

services:
  api:
    <<: *detector-common
    build:
      context: ../..
      args:
        PROJECT: ScamDetector.Api
    image: scambodia-api:local
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RateLimiting__TrustForwardedHeaders: "true"
      OnnxModel__IntraOpNumThreads: "2"
      ConnectionStrings__ScamDetector: ${SCAMDETECTOR_CONNECTION_STRING:-}
      Database__ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS:-false}
      ReportAdmin__ApiKey: ${REPORT_ADMIN_API_KEY:-}
      LlmModel__BaseUrl: http://ollama:11434
      LlmModel__Model: ${LLM_MODEL:-qwen2.5:3b}

  bot:
    <<: *detector-common
    profiles: ["bot"]
    build:
      context: ../..
      args:
        PROJECT: ScamDetector.Bot
    image: scambodia-bot:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OnnxModel__IntraOpNumThreads: "1"
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      ConnectionStrings__ScamDetector: ${SCAMDETECTOR_CONNECTION_STRING:-}
      LlmModel__BaseUrl: http://ollama:11434
      LlmModel__Model: ${LLM_MODEL:-qwen2.5:3b}
    depends_on:
      - api
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    expose:
      - "11434"
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-data:/root/.ollama

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Chạy deploy/oracle/scambodia.sh install để tạo tên miền}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  ollama-data:
  caddy-data:
  caddy-config:
