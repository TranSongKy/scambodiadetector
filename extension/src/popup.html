<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Kiểm tra tin nhắn lừa đảo</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Kiểm tra tin nhắn</h1>
    <textarea id="message" rows="6" maxlength="2000" placeholder="Dán nội dung tin nhắn nghi ngờ vào đây"></textarea>
    <button id="check" type="button">Kiểm tra</button>
    <section id="result" hidden>
      <p id="verdict"></p>
      <p id="confidence"></p>
      <ul id="reasons"></ul>
      <p id="advice" hidden></p>
    </section>
    <p id="error" role="alert" hidden></p>
    <footer><a id="open-options" href="#">Cài đặt</a></footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
